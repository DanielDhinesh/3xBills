server {
    listen 80;
    server_name danieldhinesh.online; # Change to your actual domain if different

    location / {
        # Pass everything directly to the Docker frontend container (port 3000)
        # The frontend container handles routing /api to the backend internally!
        proxy_pass http://127.0.0.1:3000;
        
        # Forward headers so the app knows the real IP and protocol
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
